SwiftCopy.Drive | Cập nhật lần cuối: 22/06/2026
1. Giới thiệu
Chào mừng bạn đến với SwiftCopy.Drive (sau đây gọi là "Dịch vụ" hoặc "Công cụ"). Bằng cách truy cập hoặc sử dụng Dịch vụ, bạn đồng ý bị ràng buộc bởi các Điều khoản Sử dụng này. Nếu bạn không đồng ý với bất kỳ điều khoản nào, vui lòng ngừng sử dụng ngay lập tức.

2. Mô tả Dịch vụ
SwiftCopy.Drive là công cụ web cho phép người dùng sao chép thư mục Google Drive từ tài khoản được chia sẻ sang tài khoản Google Drive cá nhân, chạy hoàn toàn trên trình duyệt mà không cần cài đặt phần mềm.
Dịch vụ bao gồm các tính năng:
    • Sao chép thư mục và file Google Drive với tốc độ cao
    • Kiểm tra quyền truy cập trước khi sao chép
    • Chọn lọc thư mục/file cụ thể cần sao chép
    • Theo dõi tiến trình và tự động tiếp tục nếu mất kết nối

3. Điều kiện sử dụng
Để sử dụng Dịch vụ, bạn phải:
    • Có tài khoản Google hợp lệ
    • Được Quản trị viên phê duyệt sau khi thanh toán thành công
    • Không sử dụng Dịch vụ cho các mục đích vi phạm pháp luật

4. Tài khoản và Thanh toán
SwiftCopy.Drive áp dụng mô hình thanh toán một lần — bạn chỉ trả tiền một lần duy nhất và được sử dụng trọn đời mà không phát sinh thêm phí. Tài khoản được kích hoạt thủ công bởi Quản trị viên sau khi xác nhận thanh toán thành công.
Bạn có trách nhiệm:
    • Bảo mật thông tin tài khoản Google của mình
    • Không chia sẻ quyền truy cập tài khoản SwiftCopy.Drive cho người khác
    • Thông báo ngay cho chúng tôi nếu phát hiện sử dụng trái phép

5. Quyền sở hữu trí tuệ
Toàn bộ mã nguồn, giao diện, thiết kế và nội dung của SwiftCopy.Drive thuộc quyền sở hữu của chúng tôi. Bạn không được sao chép, phân phối, chỉnh sửa hoặc tạo sản phẩm phái sinh từ bất kỳ phần nào của Dịch vụ khi chưa được sự cho phép bằng văn bản.

6. Giới hạn trách nhiệm
SwiftCopy.Drive cung cấp Dịch vụ "nguyên trạng" (as-is). Chúng tôi không chịu trách nhiệm đối với:
    • Mất mát dữ liệu do lỗi từ phía Google Drive hoặc kết nối mạng
    • Gián đoạn dịch vụ do bảo trì hoặc sự cố kỹ thuật ngoài tầm kiểm soát
    • Thiệt hại gián tiếp phát sinh từ việc sử dụng hoặc không thể sử dụng Dịch vụ
    • Thay đổi chính sách của Google ảnh hưởng đến hoạt động của Dịch vụ

7. Chấm dứt tài khoản
Chúng tôi có quyền đình chỉ hoặc chấm dứt tài khoản của bạn nếu:
    • Bạn vi phạm bất kỳ điều khoản nào trong tài liệu này
    • Phát hiện hành vi gian lận hoặc sử dụng trái phép
    • Sử dụng Dịch vụ gây hại cho hệ thống hoặc người dùng khác

/* ── HELPERS ────────────────────────────────────────────────────────────── */
function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function processText(raw) {
    let s = esc(raw);
    /* Brand name bold */
    s = s.replace(/SwiftCopy\.Drive/g, '<strong>SwiftCopy.Drive</strong>');
    /* KHÔNG in red bold — standalone uppercase */
    s = s.replace(/KHÔNG/g, '<strong style="color:#dc3545">KHÔNG</strong>');
    /* Key terms bold */
    s = s.replace(/(7 ngày|72 giờ|24 giờ|24-48 giờ|48 giờ|3-5 ngày|một lần|trọn đời)/g,
        '<strong style="color:#212529">$1</strong>');
    return s;
}

/* Parse numbered sections (skip first 2 header lines) */
function parseSections(text) {
    const lines = text.split('\n');
    const sections = [];
    let cur = null, skip = 2;
    for (const line of lines) {
        if (skip-- > 0) continue;
        const m = line.match(/^(\d+)\.\s+(.+)$/);
        if (m) {
            if (cur) sections.push(cur);
            cur = { num: m[1], title: m[2], lines: [] };
        } else if (cur) {
            cur.lines.push(line);
        }
    }
    if (cur) sections.push(cur);
    return sections;
}

/* ── RENDER FUNCTIONS (all use inline styles — Tailwind CDN timing issue) ─ */

function renderHero(title, date) {
    return `<div style="max-width:1060px;margin:0 auto;padding:52px 20px 44px">
        <p style="font-size:11px;font-weight:700;color:#adb5bd;text-transform:uppercase;letter-spacing:3px;margin-bottom:16px">Pháp lý &amp; Chính sách</p>
        <h1 style="font-family:'Nunito',sans-serif;font-size:clamp(26px,4vw,40px);font-weight:800;color:#111;margin-bottom:14px;line-height:1.2">${esc(title)}</h1>
        <div style="width:52px;height:4px;background:#ffc107;border-radius:2px;margin-bottom:14px"></div>
        <p style="font-size:13px;color:#868e96">Cập nhật lần cuối: <strong style="color:#495057">${esc(date)}</strong></p>
    </div>`;
}

function renderSection(sec) {
    let inner = '';
    let inList = false;
    for (const line of sec.lines) {
        const isBullet = /^\s*•/.test(line);
        if (isBullet) {
            const txt = line.replace(/^\s*•\s*/, '').trim();
            if (!inList) {
                inner += `<ul style="list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:7px">`;
                inList = true;
            }
            inner += `<li style="display:flex;align-items:flex-start;gap:10px;font-size:14.5px;line-height:1.75;color:#495057">
                <span style="width:8px;height:8px;min-width:8px;border-radius:50%;background:#ffc107;margin-top:8px;display:block;flex-shrink:0"></span>
                <span>${processText(txt)}</span>
            </li>`;
        } else {
            if (inList) { inner += `</ul>`; inList = false; }
            if (!line.trim()) {
                inner += `<div style="height:5px"></div>`;
            } else {
                inner += `<p style="font-size:14.5px;line-height:1.8;color:#495057;margin-bottom:6px">${processText(line.trim())}</p>`;
            }
        }
    }
    if (inList) inner += `</ul>`;

    return `<section style="margin-bottom:36px">
        <h2 style="font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:#1a1a1a;border-left:4px solid #ffc107;padding-left:14px;margin-bottom:16px;line-height:1.4;display:flex;align-items:center;gap:10px">
            <span style="background:#fff8e0;color:#b8860b;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;flex-shrink:0;font-family:'Nunito Sans',sans-serif;letter-spacing:.5px">${esc(sec.num)}</span>
            <span>${esc(sec.title)}</span>
        </h2>
        ${inner}
    </section>`;
}

function renderSidebar(summary, highlights) {
    const sItems = summary.map(s =>
        `<li style="display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.65;color:#495057">
            <span style="flex-shrink:0;margin-top:2px">${IC.check}</span>
            <span>${esc(s)}</span>
        </li>`
    ).join('');

    const hCards = highlights.map(h =>
        `<div style="background:#fff;border:1.5px solid #ffe083;border-radius:12px;padding:14px 14px 14px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.05)">
            <div style="width:36px;height:36px;min-width:36px;border-radius:10px;background:#fff8e0;display:flex;align-items:center;justify-content:center">${h.icon}</div>
            <div>
                <div style="font-weight:700;font-size:12.5px;color:#212529;margin-bottom:3px">${esc(h.title)}</div>
                <div style="font-size:12px;color:#6c757d;line-height:1.5">${esc(h.desc)}</div>
            </div>
        </div>`
    ).join('');

    return `<div style="position:sticky;top:76px">
        <div style="background:#fffbea;border:1.5px solid #ffc107;border-radius:14px;padding:20px;margin-bottom:14px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
                ${IC.list}
                <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#212529">Tóm tắt nhanh</span>
            </div>
            <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px">${sItems}</ul>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">${hCards}</div>
    </div>`;
}

function renderFooter(others) {
    const links = others.map(o =>
        `<a href="${o.href}" class="footer-link" style="font-size:13px;font-weight:600;color:#6c757d;text-decoration:none;border:1.5px solid #dee2e6;padding:8px 16px;border-radius:8px;white-space:nowrap;transition:.15s">${esc(o.label)}</a>`
    ).join('');
    return `<div style="max-width:1060px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <a href="/" style="font-size:13px;font-weight:700;color:#111;text-decoration:none;background:#ffc107;border:2px solid #ffc107;padding:9px 22px;border-radius:8px;transition:.15s">← Quay về trang chủ</a>
        <span style="font-size:13px;color:#adb5bd;font-weight:600">Chính sách khác:</span>
        ${links}
    </div>`;
}

/* ── MAIN ───────────────────────────────────────────────────────────────── */
const path = location.pathname.replace(/\/$/, '') || '/';
const meta = PAGES[path];

if (!meta) {
    document.title = 'Trang không tồn tại — SwiftCopy.Drive';
    document.getElementById('hero').innerHTML = renderHero('Trang không tồn tại', '');
    document.getElementById('mainContent').innerHTML =
        `<p style="color:#dc3545;font-size:15px">Không tìm thấy trang này. <a href="/" style="color:#dc3545;font-weight:700">Quay về trang chủ</a>.</p>`;
    document.getElementById('sidebar').innerHTML = '';
    document.getElementById('pageFooter').innerHTML = '';
} else {
    document.title = meta.title + ' — SwiftCopy.Drive';
    document.getElementById('hero').innerHTML = renderHero(meta.title, meta.date);

    const secs = parseSections(meta.text);
    document.getElementById('mainContent').innerHTML = secs.map(renderSection).join('');
    document.getElementById('sidebar').innerHTML = renderSidebar(meta.summary, meta.highlights);
    document.getElementById('pageFooter').innerHTML = renderFooter(meta.others);
}

/* ── RESPONSIVE ─────────────────────────────────────────────────────────── */
function applyLayout() {
    const body    = document.getElementById('pageBody');
    const sidebar = document.getElementById('sidebar');
    if (!body || !sidebar) return;
    if (window.innerWidth >= 1024) {
        body.style.flexDirection = 'row';
        body.style.alignItems    = 'flex-start';
        sidebar.style.width      = '284px';
        sidebar.style.flexShrink = '0';
    } else {
        body.style.flexDirection = 'column';
        body.style.alignItems    = '';
        sidebar.style.width      = '100%';
        sidebar.style.flexShrink = '';
    }
}
applyLayout();
window.addEventListener('resize', applyLayout);
</script>
